services:
  tspserver:
    image: tspserver:latest
    container_name: tspserver
    restart: unless-stopped
    environment:
      TSP_PORT: 9000
      TSP_ROUTES_DIR: /app/pages
      TSP_PUBLIC_DIR: /app/public
      TSP_EMBEDDED_WORKER: 1
      TSP_WORKER_COUNT: 2
      TSP_REDIS_URL: redis://redis:6379
    ports:
      - "9000:9000"
    volumes:
      - ../pages:/app/pages:ro
      - ../public:/app/public:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: tspserver-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
