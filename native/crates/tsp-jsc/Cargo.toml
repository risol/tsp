[package]
name = "tsp-jsc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Small JavaScriptCore ownership boundary for TSP"
build = "build.rs"

[dependencies]
tsp-js = { path = "../tsp-js" }

[features]
default = ["mock"]
mock = []
native-ffi = ["dep:mimalloc"]

[dependencies.mimalloc]
version = "0.1.52"
optional = true
default-features = false

[build-dependencies]
cc = "1"
