name: TSP v2 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tsp-v2-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "TSP v2 $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build-and-upload:
    name: Build v2 ${{ matrix.target }} release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            runtime: bun/build/release/bun
            server: release/tsp-v2-linux-x64/tspserver_v2
          - os: windows-latest
            target: windows-x64
            runtime: bun/build/release/bun.exe
            server: release/tsp-v2-windows-x64/tspserver_v2.exe
          - os: macos-latest
            target: macos
            runtime: bun/build/release/bun
            server: release/tsp-v2-macos/tspserver_v2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Package v2 release asset
        shell: bash
        run: |
          set -euo pipefail
          package_dir="release/tsp-v2-${{ matrix.target }}"
          bash scripts/package-tspserver-v2.sh \
            "${{ matrix.runtime }}" \
            "$package_dir" \
            routes \
            public

      - name: Run native process-model + start-order tests
        working-directory: bun
        run: |
          cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked
          cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

      - name: Run v2 smoke test
        if: matrix.os != 'windows-latest'
        run: bash scripts/smoke-tspserver-v2.sh "${{ matrix.server }}"

      - name: Run v2 smoke test on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/smoke-tspserver-v2.ps1 -ServerBinary "${{ matrix.server }}"

      - name: Archive v2 release asset
        shell: bash
        run: tar -czf "tsp-v2-${{ matrix.target }}.tar.gz" -C release "tsp-v2-${{ matrix.target }}"

      - name: Upload v2 release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "tsp-v2-${{ matrix.target }}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
