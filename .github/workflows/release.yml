name: TSP Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tspserver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
              --title "TSP $GITHUB_REF_NAME" --generate-notes
          fi

  build-and-upload:
    name: Build ${{ matrix.target }} release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            archive: zip
          - os: macos-latest
            target: macos-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install compiler dependencies
        working-directory: tools
        run: npm ci

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install pinned LLVM toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-21 lld-21 llvm-21 cmake ninja-build nasm

      - name: Install pinned LLVM toolchain (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@21 cmake ninja nasm
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Install pinned LLVM toolchain (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-win64.exe'
          $installer = Join-Path $env:TEMP 'llvm-installer.exe'
          Invoke-WebRequest -Uri $url -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "LLVM installer exit code: $($proc.ExitCode)" }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'

      - name: Download pinned TSP JSC SDK (Unix)
        if: matrix.os != 'windows-latest'
        run: node scripts/fetch-tsp-jsc-sdk.mjs --output "$RUNNER_TEMP/tsp-jsc-sdk"

      - name: Download pinned TSP JSC SDK (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: node scripts/fetch-tsp-jsc-sdk.mjs --output "$env:RUNNER_TEMP\tsp-jsc-sdk"

      - name: Compile application artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p "release/routes-${{ matrix.target }}"
          node tools/tspc.mjs compile --root pages --out "release/routes-${{ matrix.target }}"

      - name: Compile application artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $routes = 'release\routes-${{ matrix.target }}'
          New-Item -ItemType Directory -Path $routes -Force | Out-Null
          node tools/tspc.mjs compile --root pages --out $routes

      - name: Build native host and worker (Unix)
        if: matrix.os != 'windows-latest'
        env:
          TSP_JSC_SDK_ROOT: ${{ runner.temp }}/tsp-jsc-sdk
        run: cargo build --manifest-path native/Cargo.toml --release -p tsp-cli -p tsp-worker

      - name: Build native host and worker (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TSP_JSC_SDK_ROOT: ${{ runner.temp }}\tsp-jsc-sdk
        run: |
          $env:CXX = 'clang-cl.exe'
          $env:CFLAGS = '/MT'
          $env:CXXFLAGS = '/MT'
          cargo build --manifest-path native/Cargo.toml --release -p tsp-cli -p tsp-worker

      - name: Package native release (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          bash scripts/package-native-tspserver.sh \
            native/target/release/tsp-cli \
            native/target/release/tsp-worker \
            "release/tspserver-${{ matrix.target }}" \
            "release/routes-${{ matrix.target }}" \
            public tsp.config.json

      - name: Package native release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./scripts/package-native-tspserver.ps1 `
            -ServerBinary 'native\target\release\tsp-cli.exe' `
            -WorkerBinary 'native\target\release\tsp-worker.exe' `
            -OutputDirectory 'release\tspserver-windows-x64' `
            -RoutesDirectory 'release\routes-windows-x64' `
            -PublicDirectory 'public' -ConfigFile 'tsp.config.json'

      - name: Verify native package contents (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          package="release/tspserver-${{ matrix.target }}"
          test -x "$package/tspserver"
          test -x "$package/tsp-worker"
          test -s "$package/routes/manifest.json"
          test -s "$package/routes/bundle.js"
          test -s "$package/tsp.config.json"
          test -s "$package/AGENTS.md"
          if find "$package" -maxdepth 1 -type f -iname 'bun*' | grep -q .; then exit 1; fi

      - name: Verify native package contents (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $package = 'release\tspserver-windows-x64'
          foreach ($file in @('tspserver.exe', 'tsp-worker.exe', 'routes\manifest.json', 'routes\bundle.js', 'tsp.config.json', 'AGENTS.md')) {
            if (!(Test-Path -LiteralPath (Join-Path $package $file) -PathType Leaf)) { throw "missing package file: $file" }
          }

      - name: Run packaged application E2E (Unix)
        if: matrix.os != 'windows-latest'
        env:
          TSP_JSC_SDK_ROOT: ${{ runner.temp }}/tsp-jsc-sdk
          TSP_NATIVE_E2E_ROOT: native/fixtures/pages
          TSP_NATIVE_E2E_BINARY: ${{ github.workspace }}/release/tspserver-${{ matrix.target }}/tspserver
          TSP_NATIVE_E2E_MANIFEST: ${{ github.workspace }}/release/tspserver-${{ matrix.target }}/routes/manifest.json
          TSP_NATIVE_E2E_SKIP_BUILD: '1'
          TSP_REQUIRE_E2E: '1'
        run: node scripts/native-e2e.mjs

      - name: Run packaged application E2E (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TSP_JSC_SDK_ROOT: ${{ runner.temp }}\tsp-jsc-sdk
          TSP_NATIVE_E2E_ROOT: native/fixtures/pages
          TSP_NATIVE_E2E_BINARY: ${{ github.workspace }}\release\tspserver-windows-x64\tspserver.exe
          TSP_NATIVE_E2E_MANIFEST: ${{ github.workspace }}\release\tspserver-windows-x64\routes\manifest.json
          TSP_NATIVE_E2E_SKIP_BUILD: '1'
          TSP_REQUIRE_E2E: '1'
        run: node scripts/native-e2e.mjs

      - name: Archive release asset (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czf "tspserver-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C release "tspserver-${{ matrix.target }}"

      - name: Archive release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path 'release\tspserver-windows-x64' -DestinationPath "tspserver-$env:GITHUB_REF_NAME-windows-x64.zip" -Force

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "tspserver-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}" \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
