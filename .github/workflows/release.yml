name: TSP Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: tspserver-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "TSP $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build-and-upload:
    name: Build ${{ matrix.target }} release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            runtime: bun/build/release/bun
            server: release/tspserver-linux-x64/tspserver
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            runtime: bun/build/release/bun.exe
            server: release/tspserver-windows-x64/tspserver.exe
            archive: zip
          - os: macos-latest
            target: macos
            runtime: bun/build/release/bun
            server: release/tspserver-macos/tspserver
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-21 lld-21 llvm-21 cmake ninja-build nasm

      - name: Install pinned LLVM toolchain (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm@21 cmake ninja nasm
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"

      - name: Install pinned LLVM toolchain (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-win64.exe'
          $installer = Join-Path $env:TEMP 'llvm-installer.exe'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing LLVM 21.1.0 silently (/S)..."
          $proc = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "LLVM installer exit code: $($proc.ExitCode)" }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Build single-file TSP runtime
        working-directory: bun
        env:
          TSP_VERSION: ${{ github.ref_name }}
        run: bun run build:release

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          package_dir="release/tspserver-${{ matrix.target }}"
          bash scripts/package-tspserver.sh \
            "${{ matrix.runtime }}" \
            "$package_dir" \
            pages \
            public \
            tsp.config.json
          test -s "$package_dir/tsp.config.json"
          test -s "$package_dir/AGENTS.md"
          grep -q 'TSP User Guide for AI Assistants' "$package_dir/AGENTS.md"
          grep -q '"port": 3000' "$package_dir/tsp.config.json"
          grep -q '"publicDir": "./public"' "$package_dir/tsp.config.json"
          grep -q '"publicPrefix": "/static"' "$package_dir/tsp.config.json"
          grep -q '"count": 1' "$package_dir/tsp.config.json"
          grep -q '"name": "main"' "$package_dir/tsp.config.json"
          grep -q '"services": {}' "$package_dir/tsp.config.json"

      - name: Run native process-model + start-order tests (Linux/Windows)
        if: matrix.os != 'macos-latest'
        working-directory: bun
        run: |
          cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1
          cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

      - name: Run native process-model + start-order tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: bun
        env:
          # The release build needs LLVM 21, but these standalone Rust tests
          # do not. Use Apple's linker instead of the generated lld flags:
          # Homebrew clang rejects `-fuse-ld=lld` on the hosted macOS runner.
          CC: /usr/bin/clang
          CXX: /usr/bin/clang++
          RUSTFLAGS: -C link-arg=-Qunused-arguments -A linker_messages
          CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: /usr/bin/clang++
          CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: /usr/bin/clang++
        run: |
          cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1
          cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

      - name: Run smoke test
        if: matrix.os != 'windows-latest'
        run: bash scripts/smoke-tspserver.sh "${{ matrix.server }}"

      - name: Run smoke test on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          TSP_WORKER_STARTUP_TRACE: '1'
        run: ./scripts/smoke-tspserver.ps1 -ServerBinary "${{ matrix.server }}"

      - name: Archive release asset (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          archive="tspserver-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          package_dir="tspserver-${{ matrix.target }}"
          tar -czf "$archive" -C release "$package_dir"
          tar -tzf "$archive" | grep -Eq "(^|/)${package_dir}/AGENTS\\.md$"

      - name: Archive release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $archive = "tspserver-${{ github.ref_name }}-${{ matrix.target }}.zip"
          $packageDir = "tspserver-${{ matrix.target }}"
          Compress-Archive -Path "release/$packageDir" -DestinationPath $archive -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archive).Path)
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq "$packageDir/AGENTS.md" }
            if ($null -eq $entry) { throw "$archive does not contain $packageDir/AGENTS.md" }
          } finally {
            $zip.Dispose()
          }

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "tspserver-${GITHUB_REF_NAME}-${{ matrix.target }}.${{ matrix.archive }}" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: [build-and-upload]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
