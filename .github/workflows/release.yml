name: TSP Release

on:
  push:
    tags:
      - 'v*'

# This workflow uses only standard public-repository runners. It does not
# upload Actions artifacts, publish containers, or call any external service.
permissions:
  contents: write

concurrency:
  group: tsp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "TSP $GITHUB_REF_NAME" \
              --generate-notes
          fi

  build-and-upload:
    name: Build ${{ matrix.target }} release
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Build TSP server
        shell: bash
        run: bash ./tsp.sh build:tspserver:rel

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          package_dir="release/tsp-${{ matrix.target }}"
          mkdir -p "$package_dir"
          cp -R dist/bun/. "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          tar -czf "tsp-${{ matrix.target }}.tar.gz" -C release "tsp-${{ matrix.target }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" "tsp-${{ matrix.target }}.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: build-and-upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
