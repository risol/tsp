name: TSP CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

# Public repositories use standard GitHub-hosted runners without charge.
# Keep these labels on standard runners; do not replace them with larger
# runner labels or self-hosted paid infrastructure.
permissions:
  contents: read

concurrency:
  group: tsp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: bun test tests/unit

  native-linux:
    name: Native runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-07-20

      - name: Show toolchain
        run: rustup show active-toolchain
        working-directory: bun

      - name: Run native runtime tests
        run: cargo test -p bun_runtime_tsp --lib --no-fail-fast --locked
        working-directory: bun

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked
        working-directory: bun

      - name: Check Linux v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --target x86_64-unknown-linux-gnu --locked
        working-directory: bun

  native-windows:
    name: Native runtime (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-07-20

      - name: Show toolchain
        run: rustup show active-toolchain
        working-directory: bun

      # bun_bin needs build/debug/codegen, which is generated by `bun bd`
      # and intentionally is not committed. The release workflow performs
      # the full Bun configure/build; ordinary CI checks the standalone v2
      # host that is valid immediately after a clean checkout.
      - name: Check Windows v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --target x86_64-pc-windows-msvc --locked
        working-directory: bun

      - name: Run Windows Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked
        working-directory: bun

  native-macos:
    name: Native runtime (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUSTUP_TOOLCHAIN: nightly-2026-07-20
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@nightly-2026-07-20

      - name: Show toolchain
        run: rustup show active-toolchain
        working-directory: bun

      - name: Check macOS v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --locked
        working-directory: bun

      - name: Run macOS Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked
        working-directory: bun
