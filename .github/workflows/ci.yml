name: TSP v2 CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsp-v2-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  native-linux:
    name: Native v2 runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Run native tests
        run: cargo test -p bun_runtime_tsp --lib --no-fail-fast --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

      - name: Run start-order contract test
        run: cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

      - name: Check v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --target x86_64-unknown-linux-gnu --locked

  native-windows:
    name: Native v2 runtime (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Check v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --target x86_64-pc-windows-msvc --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

      - name: Run start-order contract test
        run: cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

  native-macos:
    name: Native v2 runtime (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Check v2 host
        run: cargo check -p bun_runtime_tsp --bin tspserver_v2 --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

      - name: Run start-order contract test
        run: cargo test -p bun_runtime_tsp --test start_order --no-fail-fast --locked

  smoke-linux:
    name: Embedded worker smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-linux
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "21.1.8"

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver-v2.sh bun/build/release/bun dist/tsp-v2 routes public

      - name: Run v2 smoke test
        run: bash scripts/smoke-tspserver-v2.sh dist/tsp-v2/tspserver_v2

  smoke-windows:
    name: Embedded worker smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: native-windows
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "21.1.8"

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver-v2.sh bun/build/release/bun.exe dist/tsp-v2 routes public

      - name: Run v2 smoke test (Windows)
        shell: pwsh
        run: ./scripts/smoke-tspserver-v2.ps1 -ServerBinary dist/tsp-v2/tspserver_v2.exe

  smoke-macos:
    name: Embedded worker smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: native-macos
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: "21.1.8"

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver-v2.sh bun/build/release/bun dist/tsp-v2 routes public

      - name: Run v2 smoke test
        run: bash scripts/smoke-tspserver-v2.sh dist/tsp-v2/tspserver_v2
