name: TSP CI

on:
  pull_request:
  push:
    branches:
      - master
      - main
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tspserver-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-07-20

jobs:
  compiler:
    name: TSP compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install compiler dependencies
        working-directory: tools
        run: npm ci

      - name: Run compiler tests
        working-directory: tools
        run: npm test

      - name: Run runtime JavaScript tests
        run: npm test --prefix native/runtime-js

      - name: Validate application routes
        working-directory: tools
        run: npm run tspc -- check --root ../pages --out .tsp-build-ci

  native-contract:
    name: TSP native contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run native contract tests
        run: cargo test --manifest-path native/Cargo.toml --workspace

      - name: Check native FFI feature
        run: cargo check --manifest-path native/Cargo.toml -p tsp-jsc --features native-ffi

  native-linux:
    name: Native runtime (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Run native tests
        run: cargo test -p bun_runtime_tsp --lib --no-fail-fast --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

      - name: Check host
        run: cargo check -p bun_runtime_tsp --bin tspserver --target x86_64-unknown-linux-gnu --locked

  native-windows:
    name: Native runtime (Windows)
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Check host
        run: cargo check -p bun_runtime_tsp --bin tspserver --target x86_64-pc-windows-msvc --locked

      - name: Run native unit tests
        run: cargo test -p bun_runtime_tsp --lib --no-fail-fast --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

  native-macos:
    name: Native runtime (macOS)
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: bun
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Fetch Cargo path dependencies
        run: |
          bun scripts/build/fetch-cli.ts dep lolhtml oven-sh/lol-html 725ce499aa9b71e38b7a2d0a9fbb6d7294a4079e vendor/lolhtml build/cache/tarballs
          bun scripts/build/fetch-cli.ts dep rust-argon2 sru-systems/rust-argon2 ed81866f163f0c7026aa6fd8388adf37242eb32a vendor/rust-argon2 build/cache/tarballs patches/rust-argon2/legacy-low-memory.patch

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Check host
        run: cargo check -p bun_runtime_tsp --bin tspserver --locked

      - name: Run native unit tests
        run: cargo test -p bun_runtime_tsp --lib --no-fail-fast --locked

      - name: Run Worker IPC integration tests
        run: cargo test -p bun_runtime_tsp --test worker_integration --no-fail-fast --locked -- --test-threads=1

      - name: Run process-model integration tests
        run: cargo test -p bun_runtime_tsp --test process_model --no-fail-fast --locked -- --test-threads=1

  smoke-linux:
    name: Embedded worker smoke test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: native-linux
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main" | sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang-21 lld-21 llvm-21 cmake ninja-build nasm

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Install TSP compiler dependencies
        working-directory: tools
        run: npm ci

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Run standalone TSP application E2E
        shell: bash
        run: |
          export TSP_WEBKIT_ROOT="$(find "$HOME/.bun/build-cache" -maxdepth 1 -type d -name 'webkit-*' -exec test -f '{}/include/JavaScriptCore/JavaScript.h' \; -exec test -f '{}/lib/libJavaScriptCore.a' \; -print -quit)"
          test -n "$TSP_WEBKIT_ROOT"
          export TSP_NATIVE_E2E_ROOT=pages
          export TSP_REQUIRE_E2E=1
          export TSP_JSC_TRACE=1
          node scripts/native-e2e.mjs

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver.sh bun/build/release/bun dist/tspserver routes public tsp.config.json

      - name: Verify default config is packaged
        run: |
          test -s dist/tspserver/tsp.config.json
          test -s dist/tspserver/AGENTS.md
          grep -q 'TSP User Guide for AI Assistants' dist/tspserver/AGENTS.md
          grep -q '"port": 3000' dist/tspserver/tsp.config.json
          grep -q '"publicDir": "./public"' dist/tspserver/tsp.config.json
          grep -q '"publicPrefix": "/static"' dist/tspserver/tsp.config.json
          grep -q '"count": 1' dist/tspserver/tsp.config.json
          grep -q '"name": "main"' dist/tspserver/tsp.config.json
          grep -q '"services": {}' dist/tspserver/tsp.config.json

      - name: Run application E2E tests
        env:
          TSP_REQUIRE_E2E: '1'
          TSP_TEST_MASTER: ${{ github.workspace }}/dist/tspserver/tspserver
        run: cargo test --manifest-path bun/Cargo.toml -p bun_runtime_tsp --test start_order --no-fail-fast --locked -- --test-threads=1

      - name: Run smoke test
        run: bash scripts/smoke-tspserver.sh dist/tspserver/tspserver

  smoke-windows:
    name: Embedded worker smoke test (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    needs: native-windows
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.0/LLVM-21.1.0-win64.exe'
          $installer = Join-Path $env:TEMP 'llvm-installer.exe'
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Write-Host "Installing LLVM 21.1.0 silently (/S)..."
          $proc = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "LLVM installer exit code: $($proc.ExitCode)" }
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\LLVM\bin'

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Install TSP compiler dependencies
        working-directory: tools
        run: npm ci

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Run standalone TSP application E2E
        shell: pwsh
        run: |
          $root = Get-ChildItem "$env:USERPROFILE\.bun\build-cache" -Directory -Filter 'webkit-*' |
            Where-Object { (Test-Path -LiteralPath (Join-Path $_.FullName 'include\JavaScriptCore\JavaScript.h')) -and (Test-Path -LiteralPath (Join-Path $_.FullName 'include\wtf\PlatformEnableWin.h')) -and (Test-Path -LiteralPath (Join-Path $_.FullName 'lib\JavaScriptCore.lib')) } |
            Select-Object -First 1
          if ($null -eq $root) { throw 'No Windows WebKit prebuilt with TSP JSC headers was found' }
          $env:TSP_WEBKIT_ROOT = $root.FullName
          $env:TSP_NATIVE_E2E_ROOT = 'pages'
          $env:TSP_REQUIRE_E2E = '1'
          $env:TSP_JSC_TRACE = '1'
          node scripts/native-e2e.mjs

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver.sh bun/build/release/bun.exe dist/tspserver routes public tsp.config.json

      - name: Verify default config is packaged
        shell: pwsh
        run: |
          $config = 'dist/tspserver/tsp.config.json'
          $agents = 'dist/tspserver/AGENTS.md'
          if (!(Test-Path -LiteralPath $agents -PathType Leaf)) { throw 'AGENTS.md was not packaged' }
          if ((Get-Content -Raw -LiteralPath $agents) -notmatch 'TSP User Guide for AI Assistants') { throw 'Packaged AGENTS.md is invalid' }
          if (!(Test-Path -LiteralPath $config -PathType Leaf)) { throw 'Default config was not packaged' }
          $text = Get-Content -Raw -LiteralPath $config
          if ($text -notmatch '"port"\s*:\s*3000') { throw 'Packaged config is missing port default' }
          if ($text -notmatch '"publicDir"\s*:\s*"\.\/public"') { throw 'Packaged config is missing publicDir default' }
          if ($text -notmatch '"publicPrefix"\s*:\s*"\/static"') { throw 'Packaged config is missing publicPrefix default' }
          if ($text -notmatch '"count"\s*:\s*1') { throw 'Packaged config is missing worker count default' }
          if ($text -notmatch '"name"\s*:\s*"main"') { throw 'Packaged config is missing application name default' }
          if ($text -notmatch '"services"\s*:\s*\{\s*\}') { throw 'Packaged config is missing services default' }

      - name: Run application E2E tests
        shell: pwsh
        env:
          TSP_REQUIRE_E2E: '1'
          TSP_WORKER_STARTUP_TRACE: '1'
          TSP_WORKER_STARTUP_TRACE_FILE: ${{ runner.temp }}/tsp-worker-startup.log
          TSP_TEST_MASTER: ${{ github.workspace }}/dist/tspserver/tspserver.exe
        run: cargo test --manifest-path bun/Cargo.toml -p bun_runtime_tsp --test start_order --no-fail-fast --locked -- --test-threads=1

      - name: Show worker startup trace after failure
        if: failure()
        shell: pwsh
        run: |
          $trace = '${{ runner.temp }}/tsp-worker-startup.log'
          if (Test-Path -LiteralPath $trace) { Get-Content -LiteralPath $trace }

      - name: Run smoke test (Windows)
        shell: pwsh
        env:
          TSP_WORKER_STARTUP_TRACE: '1'
        run: ./scripts/smoke-tspserver.ps1 -ServerBinary dist/tspserver/tspserver.exe

  smoke-macos:
    name: Embedded worker smoke test (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: native-macos
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up bootstrap Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-20

      - name: Install pinned LLVM toolchain
        run: |
          brew install llvm@21 cmake ninja nasm
          echo "/opt/homebrew/opt/llvm@21/bin" >> "$GITHUB_PATH"

      - name: Install Bun fork dependencies
        working-directory: bun
        run: bun install --frozen-lockfile

      - name: Install TSP compiler dependencies
        working-directory: tools
        run: npm ci

      - name: Build single-file TSP runtime
        working-directory: bun
        run: bun run build:release

      - name: Run standalone TSP application E2E
        shell: bash
        run: |
          export TSP_WEBKIT_ROOT="$(find "$HOME/.bun/build-cache" -maxdepth 1 -type d -name 'webkit-*' -exec test -f '{}/include/JavaScriptCore/JavaScript.h' \; -exec test -f '{}/lib/libJavaScriptCore.a' \; -print -quit)"
          test -n "$TSP_WEBKIT_ROOT"
          export TSP_NATIVE_E2E_ROOT=pages
          export TSP_REQUIRE_E2E=1
          export TSP_JSC_TRACE=1
          node scripts/native-e2e.mjs

      - name: Package single-file TSP runtime
        run: bash scripts/package-tspserver.sh bun/build/release/bun dist/tspserver routes public tsp.config.json

      - name: Verify default config is packaged
        run: |
          test -s dist/tspserver/tsp.config.json
          test -s dist/tspserver/AGENTS.md
          grep -q 'TSP User Guide for AI Assistants' dist/tspserver/AGENTS.md
          grep -q '"port": 3000' dist/tspserver/tsp.config.json
          grep -q '"publicDir": "./public"' dist/tspserver/tsp.config.json
          grep -q '"publicPrefix": "/static"' dist/tspserver/tsp.config.json
          grep -q '"count": 1' dist/tspserver/tsp.config.json
          grep -q '"name": "main"' dist/tspserver/tsp.config.json
          grep -q '"services": {}' dist/tspserver/tsp.config.json

      - name: Run application E2E tests
        env:
          TSP_REQUIRE_E2E: '1'
          TSP_TEST_MASTER: ${{ github.workspace }}/dist/tspserver/tspserver
        run: cargo test --manifest-path bun/Cargo.toml -p bun_runtime_tsp --test start_order --no-fail-fast --locked -- --test-threads=1

      - name: Run smoke test
        run: bash scripts/smoke-tspserver.sh dist/tspserver/tspserver
