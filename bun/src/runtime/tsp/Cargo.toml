[package]
name = "bun_runtime_tsp"
version.workspace = true
edition.workspace = true

# TSP native host (see `tsp-plan.md` sect.26).
#
# The legacy `src/main.ts` host is gone. This crate is the runtime
# entry point for the current TSP server.
# (HTTP -> routes/index.tsp -> TSX transform -> JSC -> GET -> response)
# and lives behind `bin/tspserver.rs`. Library code is the same source
# the bin re-uses so future tests and embedded callers can drive the
# host without spawning a process.
[lib]
path = "lib.rs"

[[bin]]
name = "tspserver"
path = "bin/tspserver.rs"

[[bin]]
name = "tsp_worker_test_stub"
path = "worker_test_stub.rs"

[lints]
workspace = true

# Slice 7: keep the future in-process JSC bridge behind an opt-in feature.
# Production currently uses the subprocess path in `jsc_bridge.rs`; making
# `bun_runtime` optional keeps this host independently buildable without
# forcing Bun's full generated/codegen build into every TSP iteration.
#
# Cost: the first `cargo build` here takes 20-40 minutes on a clean
# cache -- basically every Bun workspace crate needs to compile.
# Subsequent `cargo build` calls are fast.
[features]
in-process-jsc = ["dep:bun_runtime"]
# Enabled only when this host is linked into the bundled `tspserver`
# executable. The master then creates workers from the same executable.
embedded-worker-entry = []

[dependencies]
bun_runtime = { workspace = true, optional = true }
libc.workspace = true

[dev-dependencies]
# The process-model and start-order tests use `libc::kill` /
# `libc::SIGTERM` directly; the production crate already
# depends on `libc`, but integration tests cannot see the
# parent's deps, so the dev-dep is the documented path.
libc.workspace = true
