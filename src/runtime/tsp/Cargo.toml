[package]
name = "bun_runtime_tsp"
version.workspace = true
edition.workspace = true

# TSP v2 native host (see `tsp-v2-plan.md` §26).
#
# v1 `src/main.ts` is unchanged. This crate is the side-by-side v2 runtime
# entry point; PoC 1 (plan §70) is the 7-step vertical slice
# (HTTP -> routes/index.tsp -> TSX transpile -> JSC -> GET -> response)
# and lives behind `bin/tspserver_v2.rs`. Library code is the same source
# the bin re-uses so future tests and embedded callers can drive it.
[lib]
path = "lib.rs"

[[bin]]
name = "tspserver_v2"
path = "bin/tspserver_v2.rs"

[lints]
workspace = true

# Slice 1: zero external deps. JSC + transpiler land in Slice 4.
[dependencies]
