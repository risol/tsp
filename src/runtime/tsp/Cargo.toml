[package]
name = "bun_runtime_tsp"
version.workspace = true
edition.workspace = true

# TSP v2 native host (see `tsp-v2-plan.md` sect.26).
#
# v1 `src/main.ts` is unchanged. This crate is the side-by-side v2 runtime
# entry point; PoC 1 (plan sect.70) is the 7-step vertical slice
# (HTTP -> routes/index.tsp -> TSX transform -> JSC -> GET -> response)
# and lives behind `bin/tspserver_v2.rs`. Library code is the same source
# the bin re-uses so future tests and embedded callers can drive it.
[lib]
path = "lib.rs"

[[bin]]
name = "tspserver_v2"
path = "bin/tspserver_v2.rs"

[lints]
workspace = true

# Slice 6 (pivot): instead of pulling in `bun_runtime` (cold compile
# 20-40 min) or wiring `bun_jsc` directly (not a standalone embeddable
# VM per slice 4's discovery), the host spawns the project's vendored
# `bun.exe` (1.4.0+) as a subprocess to evaluate a slice-6-prepared
# `.js` file. That keeps PoC 1's "JSC is the execution engine" promise
# (plan sect.25) while side-stepping the bun_runtime C++/codegen
# integration this session. The full in-process bridge lands in slice
# 7+ when we have the time budget for the heavy compile.
#
# The deps are intentionally zero: the host is a small orchestrator.
[dependencies]